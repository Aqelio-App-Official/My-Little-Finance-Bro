<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Little Finance Bro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDF2EA; --bg2:#C9E7DB; --surface:#FFFFFF; --surface2:#EEF9F4;
  --ink:#14303B; --ink2:#48656F; --line:#BFDDD1; --edge:#14303B;
  --green:#12A05F; --green-t:#D3F4E3; --on-green:#FFFFFF;
  --gold:#F5B71C; --gold-t:#FFF0C4; --gold-ink:#3D2A00;
  --pink:#FF6B8B; --pink-t:#FFDCE5; --sky:#2FA8E0; --sky-t:#D6F0FB;
  --red:#E5484D; --red-t:#FFDADA; --violet:#8A5CF0;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E2028; --bg2:#14313B; --surface:#17303A; --surface2:#1D3B46;
    --ink:#E8F5F0; --ink2:#9FBDB6; --line:#2A4B56; --edge:#050E12;
    --green:#38D48B; --green-t:#14402E; --on-green:#06231A;
    --gold-t:#463A14; --pink-t:#4A2432; --sky:#4DBBEA; --sky-t:#153A4B; --red-t:#4A2226;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2028; --bg2:#14313B; --surface:#17303A; --surface2:#1D3B46;
  --ink:#E8F5F0; --ink2:#9FBDB6; --line:#2A4B56; --edge:#050E12;
  --green:#38D48B; --green-t:#14402E; --on-green:#06231A;
  --gold-t:#463A14; --pink-t:#4A2432; --sky:#4DBBEA; --sky-t:#153A4B; --red-t:#4A2226;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--bg2) 1.6px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font:500 16px/1.45 var(--font-b);min-height:100vh;padding-bottom:96px}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;font-weight:600;line-height:1.15;letter-spacing:.1px}
h2{font-size:24px;margin:24px 0 10px}
h3{font-size:18px}
p{margin:0 0 10px}
small,.muted{color:var(--ink2)}
.fine{font-size:13px;color:var(--ink2)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.grow1{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.neg{color:var(--red)}
.pos{color:var(--green)}
.app{max-width:1080px;margin:0 auto;padding:0 14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:19px;line-height:1.02}
.logo{width:46px;height:46px;flex:none;border:2.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--sky-t);box-shadow:0 3px 0 var(--edge)}
.logo svg{display:block;width:100%;height:100%}
.top-r{display:flex;align-items:center;gap:10px}
.coins{display:flex;align-items:center;gap:6px;background:var(--gold-t);border:2.5px solid var(--edge);border-radius:99px;padding:5px 12px 5px 8px;font:600 18px var(--font-d);box-shadow:0 3px 0 var(--edge)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.layout{display:grid;gap:16px}
.stage-col{display:none}
body[data-tab="home"] .stage-col{display:block}
.content{min-width:0}
@media (min-width:960px){
  .layout{grid-template-columns:400px 1fr;align-items:start;gap:26px}
  body[data-tab] .stage-col{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}
  body{padding-bottom:40px}
}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;background:var(--surface);border-top:2.5px solid var(--edge);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{position:relative;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:6px 4px;font:600 12px var(--font-d);color:var(--ink2)}
.tab.on{color:var(--on-green);background:var(--green)}
.tab .dot{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--pink);color:#fff;font:700 10px/16px var(--font-d);text-align:center;border:2px solid var(--surface);padding:0 3px}
@media (min-width:960px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);bottom:auto;left:auto;right:auto;z-index:12;border:2.5px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--edge);padding:6px;margin-bottom:14px}
  .tab{flex-direction:row;justify-content:center;gap:8px;font-size:15px;max-width:none;padding:9px 6px}
  .tab .dot{position:static;margin-left:2px;border-color:transparent}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 16px var(--font-d);background:var(--surface);color:var(--ink);border:2.5px solid var(--edge);border-radius:14px;padding:9px 16px;box-shadow:0 4px 0 var(--edge);transition:transform .06s,box-shadow .06s;min-height:44px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.sm{padding:5px 12px;font-size:14px;min-height:36px;box-shadow:0 3px 0 var(--edge);border-radius:12px}
.btn.big{width:100%;font-size:19px;padding:13px}
.link{background:none;border:0;padding:6px 4px;color:var(--ink2);font:600 14px var(--font-b);text-decoration:underline;text-underline-offset:3px;min-height:36px}
.link.dng{color:var(--red)}
.x{background:none;border:0;color:var(--ink2);width:32px;height:32px;border-radius:8px;font-size:14px}
.x:hover{background:var(--red-t);color:var(--red)}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font:600 21px/1.15 var(--font-d);overflow-wrap:anywhere}
.stat span{font-size:13px;color:var(--ink2)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.qa .btn{flex-direction:column;gap:2px;font-size:15px;padding:8px 6px;line-height:1.1}
.qa .btn span{font-size:22px}

/* stage */
.stage{background:var(--surface);border:2.5px solid var(--edge);border-radius:28px;box-shadow:0 6px 0 var(--edge);padding:14px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-head .nm{font:600 24px var(--font-d);overflow-wrap:anywhere}
.stage-head .ttl{font-size:14px;color:var(--ink2)}
.streak{font:600 15px var(--font-d);background:var(--pink-t);border-radius:99px;padding:4px 12px;white-space:nowrap}
.xp{height:8px;border-radius:99px;background:var(--surface2);margin:8px 0 12px;overflow:hidden;border:1.5px solid var(--line)}
.xp i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .4s}
.bubble{position:relative;width:min(100%,330px);margin:0 auto 14px;background:var(--surface2);border:2.5px solid var(--edge);border-radius:16px;padding:9px 13px;font-size:14.5px;line-height:1.3;min-height:3.6em;display:flex;align-items:center}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;width:14px;height:14px;background:var(--surface2);border-right:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .3s ease-out}
.scene-wrap{position:relative;width:min(100%,330px);margin:0 auto}
.scene{display:block;width:100%;padding:0;border:2.5px solid var(--edge);border-radius:22px;overflow:hidden;background:var(--surface2);aspect-ratio:5/6;touch-action:manipulation}
.scene svg{display:block;width:100%;height:100%}
.pv-tag{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:5px 8px 5px 12px;font-size:13.5px;font-weight:600}
.pv-tag button{background:var(--gold);color:var(--gold-ink);border:2px solid var(--edge);border-radius:8px;padding:2px 10px;font-weight:700}
.meters{display:grid;gap:7px;margin:14px 0}
.meter{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:8px;font-size:14px}
.meter span{font:600 14px var(--font-d)}
.meter b{text-align:right;font-family:var(--font-d)}
.bar{height:14px;border-radius:99px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s,background .3s}
.bar.green i{background:var(--green)} .bar.gold i{background:var(--gold)} .bar.pink i{background:var(--pink)} .bar.red i{background:var(--red)} .bar.sky i{background:var(--sky)}
.stage-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage-actions .btn{padding:8px 6px;font-size:15px}
.heart{position:absolute;font-size:22px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:3}
.bro{transform-origin:100px 228px;animation:bob 3.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.chew{transform-box:fill-box;transform-origin:center;animation:chew .3s infinite alternate}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes chew{to{transform:scaleY(.55)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.burst span{position:absolute;top:60%;font-size:26px;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}

/* advice */
.adv{display:flex;gap:12px;background:var(--surface);border:2px solid var(--line);border-left-width:8px;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.adv.warn{border-left-color:var(--red)} .adv.caution{border-left-color:var(--gold)} .adv.info{border-left-color:var(--sky)} .adv.good{border-left-color:var(--green)}
.adv .ai{font-size:26px;line-height:1.2}
.adv h3{font-size:17px;margin-bottom:3px}
.adv p{font-size:15px;color:var(--ink2);margin-bottom:8px}

/* budget */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.mnav h2{margin:0;font-size:22px}
.mnav .icon-btn{width:38px;height:38px;border-radius:12px;font-weight:700}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;border:2px solid var(--edge);background:var(--surface2);margin:12px 0 6px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ce{font-size:28px;width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--surface2);border-radius:14px}
.cat-h b{font-size:14px;text-align:right}
.cat-a{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.li:last-child{border-bottom:0}
.li .d{color:var(--ink2);width:52px;flex:none;font-size:13px}
.empty{text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:20px;color:var(--ink2);margin-bottom:12px}
.empty b{display:block;font:600 19px var(--font-d);color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:10px}

/* segmented + chips */
.seg{display:flex;gap:6px;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;background:none;border:0;border-radius:12px;padding:8px 10px;font:600 15px var(--font-d);color:var(--ink2);min-height:40px}
.seg button.on{background:var(--green);color:var(--on-green)}
.seg button.swatch{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sw);border:3px solid var(--edge);padding:0}
.seg button.swatch.on{outline:3px solid var(--sky);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:44px;height:44px;font-size:22px;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:0}
.chip.on{border-color:var(--green);background:var(--green-t)}
.slots{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.slots button{flex:none;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:7px 16px;font:600 15px var(--font-d)}
.slots button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shop */
.mini-prev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:6;display:flex;gap:12px;align-items:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:20px;padding:8px 12px;margin-bottom:12px;box-shadow:0 4px 0 var(--edge)}
.mini-prev [data-live-bro]{width:84px;flex:none;border-radius:14px;overflow:hidden;border:2px solid var(--edge);aspect-ratio:5/6;background:var(--surface2)}
.mini-prev svg{display:block;width:100%;height:100%}
@media (min-width:960px){.mini-prev{display:none}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item.eq{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.thumb{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-size:54px}
.thumb svg{display:block;width:100%;height:100%}
.item h3{font-size:16px}
.item small{font-size:12.5px}
.tier{align-self:flex-start;font:600 12px var(--font-d);padding:1px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.tier.t-common{background:var(--sky-t);color:var(--ink)} .tier.t-rare{background:var(--green-t);color:var(--ink)} .tier.t-epic{background:#E8DBFF;color:#3B2472} .tier.t-legendary{background:var(--gold);color:var(--gold-ink)}
.item-a{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.item-a .btn{flex:1;padding:5px 8px;font-size:14px;min-height:36px;box-shadow:0 3px 0 var(--edge);border-radius:12px}

/* quests */
.quest{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.quest.ready{border-color:var(--gold);background:var(--gold-t)}
.quest.done{opacity:.6}
.quest h3{font-size:17px}
.quest .qr{display:flex;align-items:center;gap:4px;font:600 15px var(--font-d);white-space:nowrap}

/* goals, invest, market */
.goal-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pct{font:600 20px var(--font-d)}
details{margin-top:8px}
summary{cursor:pointer;font:600 14px var(--font-b);color:var(--ink2);padding:6px 0}
.calc label{display:block;font-weight:600;font-size:14px;margin:10px 0 2px}
.calc output{float:right;font-family:var(--font-d);font-weight:600}
.calc input[type=range]{width:100%;accent-color:var(--green)}
.calc-out{background:var(--green-t);border-radius:14px;padding:12px;margin:12px 0 4px;font-size:15px}
.tick{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.tick h3{font-size:17px}
.tick .px{text-align:right;font:600 19px var(--font-d)}
.tick .px small{display:block;font:600 13px var(--font-b)}
.spark{width:110px;height:34px}
.spark polyline{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark.up polyline{stroke:var(--green)} .spark.dn polyline{stroke:var(--red)}
.tick .full{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bars{display:grid;gap:8px}
.bars div{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:14px}

/* forms + modal */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(8,22,28,.6);display:flex;align-items:flex-end;justify-content:center}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border:2.5px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media (min-width:600px){.modal-wrap{align-items:center}.modal{border-bottom:2.5px solid var(--edge);border-radius:28px;padding-bottom:22px;box-shadow:0 8px 0 var(--edge)}}
.modal h2{margin:0 0 12px;font-size:24px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field input,.field select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:500 16px var(--font-b)}
textarea{min-height:150px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.field input:focus,.field select:focus,textarea:focus{outline:3px solid var(--sky);outline-offset:1px;border-color:var(--sky)}
.field small{display:block;margin-top:4px}
.err{color:var(--red);font-weight:600;min-height:1.4em;margin:0}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 16px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--green)}
.feed-list{display:grid;gap:8px}
.feed-item{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.feed-item .fe{font-size:30px}
.feed-item small{display:block}
.feed-item em{font:600 15px var(--font-d);font-style:normal}
.set-prev{width:120px;margin:0 auto 12px;border-radius:18px;overflow:hidden;border:2.5px solid var(--edge);aspect-ratio:1;background:var(--surface2)}
.set-prev svg{display:block;width:100%;height:100%}

/* onboarding */
.onboard{position:fixed;inset:0;z-index:80;overflow:auto;background-color:var(--bg);background-image:radial-gradient(var(--bg2) 1.6px,transparent 1.6px);background-size:24px 24px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px))}
.ob-card{max-width:460px;margin:0 auto}
.ob-title{font-size:38px;line-height:1;text-align:center}
.ob-sub{text-align:center;color:var(--ink2);margin:10px 0 16px}

@media (min-width:960px){.toast{bottom:30px}}

@media (prefers-reduced-motion:reduce){

function burst(ch = '🪙', n = 10) {
  if (RM) return;
  const w = document.createElement('div'); w.className = 'burst';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.textContent = ch;
    s.style.setProperty('--x', (Math.random() * 2 - 1) * 140 + 'px');
    s.style.setProperty('--y', -(90 + Math.random() * 160) + 'px');
    s.style.setProperty('--r', (Math.random() * 2 - 1) * 90 + 'deg');
    s.style.left = (30 + Math.random() * 40) + '%';

function checkIn() {
  const t = ymd();
  if (S.streak.last === t) return null;
  const y = ymd(addDays(new Date(), -1));
  S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
  S.streak.last = t;
  return [3 + Math.min(S.streak.count, 7), S.streak.count > 1 ? S.streak.count + '-day streak' : 'daily check-in'];
}
function award(items, opt = {}) {
  let total = sum(items.map(i => i[0]));
  if (total <= 0) return 0;
  const t = ymd();
  if (S.daily.date !== t) S.daily = { date: t, earned: 0 };
  let capped = false;
  if (!opt.nocap) {
    const room = Math.max(0, DAILY_CAP - S.daily.earned);
    if (total > room) { total = room; capped = true; }
    S.daily.earned += total;
  }
  const before = lvl(S.xp);
  S.coins += total; S.xp += total; S.lifetime += total;
  const after = lvl(S.xp);
  if (total > 0) toast('+' + total + ' coins · ' + items.map(i => i[1]).join(', ') + (capped ? ' (daily cap hit)' : ''), { coin: true });
  else toast('Daily coin cap reached (' + DAILY_CAP + '). Your bro respects discipline, not grinding.');
  if (after > before) { const li = levelInfo(); setTimeout(() => { burst('⭐', 14); say('LEVEL UP. Lv ' + li.l + ', ' + li.title + '. Someone get me a vest.'); }, 500); }
  return total;
}
function reverseReward(n) { if (n > 0) { S.coins = Math.max(0, S.coins - n); S.xp = Math.max(0, S.xp - n); S.lifetime = Math.max(0, S.lifetime - n); } }

  { t: 'BROC', name: 'Bro Capital Index', vol: .008, drift: .0004, p0: 100, blurb: 'A broad index fund. Boring. Reliable.' },

];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function stepMarket(n) {
  const M = S.market;
  for (let d = 0; d < n; d++) {
    TICKERS.forEach(k => {
      let p = M.prices[k.t] * Math.exp(k.drift - .5 * k.vol * k.vol + k.vol * gauss());
      p = Math.max(.5, p);
      M.prices[k.t] = p;
      const h = M.hist[k.t]; h.push(p); if (h.length > 60) h.shift();
    });
    M.day++;
  }
}
function ensureMarket() {
  if (S.market) return;
  const M = { cash: 10000, hold: {}, cost: {}, prices: {}, hist: {}, last: Date.now(), day: 0, trades: 0 };
  TICKERS.forEach(k => { M.prices[k.t] = k.p0; M.hist[k.t] = [k.p0]; M.hold[k.t] = 0; M.cost[k.t] = 0; });
  S.market = M; stepMarket(30); M.day = 0; save();
}
function catchUpMarket() {
  ensureMarket();
  const M = S.market, n = Math.min(40, Math.floor((Date.now() - M.last) / 600000));
  if (n > 0) { stepMarket(n); M.last += n * 600000; if (Date.now() - M.last > 40 * 600000) M.last = Date.now(); save(); }
}
const marketValue = () => { const M = S.market; return M.cash + sum(TICKERS.map(k => M.hold[k.t] * M.prices[k.t])); };
function spark(h) {
  const w = 110, ht = 34, mn = Math.min(...h), mx = Math.max(...h);
  const pts = h.map((v, i) => (i / (h.length - 1) * w).toFixed(1) + ',' + (ht - 2 - (v - mn) / (mx - mn || 1) * (ht - 4)).toFixed(1)).join(' ');
  return `<svg class="spark ${h[h.length - 1] >= h[0] ? 'up' : 'dn'}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

function calcText(fv) {
  const contrib = CALC.m * CALC.y * 12;
  return `In ${CALC.y} year${CALC.y === 1 ? '' : 's'}, ${money(CALC.m)}/month could grow to about <b>${money(Math.round(fv))}</b>: ${money(contrib)} from you and ${money(Math.max(0, Math.round(fv - contrib)))} from compounding at ${CALC.r}%/year.`;
}
function updateCalc() {
  CALC.m = +$('#calcM').value; CALC.y = +$('#calcY').value; CALC.r = +$('#calcR').value;
  const r = CALC.r / 100 / 12, n = CALC.y * 12;
  const fv = r === 0 ? CALC.m * n : CALC.m * ((Math.pow(1 + r, n) - 1) / r);
  $('#oM').textContent = money(CALC.m); $('#oY').textContent = CALC.y; $('#oR').textContent = CALC.r + '%';
  $('#calcOut').innerHTML = calcText(fv);
}

function openModal(html) {
  closeModal(true);
  lastFocus = document.activeElement;
  const w = document.createElement('div'); w.className = 'modal-wrap'; w.id = 'modal';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener('mousedown', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w); document.body.classList.add('noscroll');
  const f = $('input:not([type=hidden]),select,textarea,button.btn', w); if (f) f.focus({ preventScroll: true });
}
function closeModal(silent) {
  const w = $('#modal'); if (w) w.remove();
  document.body.classList.remove('noscroll');
  if (!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}

}

/* practice trades */
function openTrade(t, side) {
  const M = S.market, k = TICKERS.find(x => x.t === t), p = M.prices[t], hv = M.hold[t] * p;
  const buy = side === 'buy';
  openForm({
    title: (buy ? 'Buy ' : 'Sell ') + t,
    intro: k.name + ' is ' + money(p) + ' per share. ' + (buy ? 'You have ' + money(M.cash) + ' of practice cash.' : 'You hold ' + money(hv) + '.'),
    fields: [{ name: 'amount', label: 'Amount ($)', type: 'number', step: '0.01', min: 0, inputmode: 'decimal', placeholder: buy ? '1000' : String(Math.floor(hv)) }],
    submit: buy ? 'Buy' : 'Sell',
    validate: v => { const a = parseAmt(v.amount); if (!(a > 0)) return 'Enter an amount above $0.'; if (buy && a > M.cash + 0.005) return 'That’s more than your practice cash.'; if (!buy && a > hv + 0.005) return 'That’s more than you hold.'; },
    onSubmit: v => {
      const a = parseAmt(v.amount);
      if (buy) { M.hold[t] += a / p; M.cost[t] += a; M.cash -= a; }
      else { const sh = Math.min(M.hold[t], a / p), frac = M.hold[t] ? sh / M.hold[t] : 0; M.cost[t] *= (1 - frac); M.hold[t] -= sh; M.cash += a; if (M.hold[t] < 1e-6) { M.hold[t] = 0; M.cost[t] = 0; } }
      M.trades++; save(); render();
      say(buy ? 'Bought ' + t + '. Never invest more than you can afford to lose. Real life, I mean.' : 'Sold some ' + t + '. Taking profits or cutting losses, either way you learned.');
    }
  });
}
function sellAll(t) {
  const M = S.market, p = M.prices[t]; if (!(M.hold[t] > 0)) return;
  M.cash += M.hold[t] * p; M.hold[t] = 0; M.cost[t] = 0; M.trades++; save(); render(); toast('Sold all ' + t + '.');
}

/* feed / chat / pet */
const EAT_LINES = ['Nom. Best expense ever.', 'Fuel for the grind.', 'Om nom. Tax-deductible, probably not.', 'That hit the spot, boss.'];
function openFeed() {
  const foods = [{ id: 'water', name: 'Sparkling water', emoji: '💧', fed: 4, fun: 0, qty: Infinity }].concat(ITEMS.filter(i => i.slot === 'snack' && (S.inv[i.id] || 0) > 0).map(i => Object.assign({}, i, { qty: S.inv[i.id] })));
  openModal(`<h2>Feed ${esc(S.name)}</h2><p class="muted">Snacks come from the Shop. Water is always free.</p><div class="feed-list">${foods.map(f => `<button class="feed-item" data-a="eat" data-id="${f.id}"><span class="fe" aria-hidden="true">${f.emoji}</span><span class="grow1"><b>${esc(f.name)}</b><small>+${f.fed} full${f.fun ? ', +' + f.fun + ' fun' : ''}</small></span><em>${f.qty === Infinity ? 'free' : '×' + f.qty}</em></button>`).join('')}</div><div class="row end"><button class="btn" data-a="tab" data-tab="shop" data-slot="snack">Buy snacks</button><button class="btn ghost" data-a="closeModal">Close</button></div>`);
}
function eat(id) {
  const f = id === 'water' ? { fed: 4, fun: 0 } : ITEM[id];
  if (id !== 'water') { if (!(S.inv[id] > 0)) return; S.inv[id]--; }
  if (S.fed >= 98 && S.fun >= 98) { toast('Stuffed and thrilled already. Save the snack.'); if (id !== 'water') S.inv[id]++; return; }
  S.fed = Math.min(100, S.fed + f.fed); S.fun = Math.min(100, S.fun + (f.fun || 0));
  save(); closeModal(true); setMood('eat', 1600); say(pick1(EAT_LINES)); render();
}
function chat() {
  const a = advice(); if (!a.length) return;
  const x = a[S.advIdx % a.length]; S.advIdx++; save();
  say(x.say); setMood(x.tone === 'warn' ? 'stress' : x.tone === 'good' ? 'great' : 'happy', 1800);
}
const PET_LINES = ['Hehe, that tickles.', 'Bro. Bro. Bro. Love it.', 'Vibes: immaculate.', 'Dollar-cost averaging your affection. Smart.', 'You get +2 fun. I get +2 fun. Win-win.', 'Okay okay okay, I’m thriving.'];
let petN = 0;
function pet(e) {
  S.fun = Math.min(100, S.fun + 2);
  const wrap = e.target.closest('.scene-wrap'), r = wrap.getBoundingClientRect();
  if (!RM) {
    const h = document.createElement('span'); h.className = 'heart'; h.textContent = pick1(['💚', '💖', '✨']);
    h.style.left = ((e.clientX || r.left + r.width / 2) - r.left - 10) + 'px'; h.style.top = ((e.clientY || r.top + r.height / 2) - r.top - 10) + 'px';
    wrap.appendChild(h); setTimeout(() => h.remove(), 1000);
  }
  petN++; if (petN % 3 === 1) say(pick1(PET_LINES));
  setMood('great', 900); updateMeters(); if (petN % 5 === 0) save();
}

/* shop actions */
function buy(id) {
  const it = ITEM[id]; if (!it || S.coins < it.price) return;
  S.coins -= it.price;
  if (it.slot === 'snack') { S.inv[id] = (S.inv[id] || 0) + 1; save(); render(); toast('Bought ' + it.name + '. Feed it from the Home tab.'); return; }
  S.owned.push(id); S.eq[it.slot] = id; PV = null; save(); render(); burst('✨', 12);
  say(pick1(['Oh, that’s a good look.', 'Ten out of ten. Would expense again.', 'I feel like a million bucks. Actually, a few hundred coins.'])); setMood('great', 1800);
}
function equip(id) { const it = ITEM[id]; if (!S.owned.includes(id)) return; S.eq[it.slot] = id; if (PV && PV.slot === it.slot) PV = null; save(); render(); }

/* quests */
function claim(id) {
  const q = QUESTS.find(x => x.id === id); if (!q) return;
  const s = qState(q); if (!s.ready || s.claimed) return;
  S.claimed[qKey(q)] = true;
  award([[q.reward, q.t]], { nocap: true }); save(); render();
  say('Quest complete: ' + q.t + '. Look at you go.'); setMood('great', 2000);
}

/* settings + data */
function openSettings() {
  openForm({
    title: 'Settings',
    pre: `<div class="set-prev" id="setPrev">${broSVG({ vb: '20 10 160 160', mood: 'happy' })}</div>`,
    fields: [
      { name: 'name', label: 'Bro’s name', value: S.name, maxlength: 14 },
      { name: 'income', label: 'Monthly take-home income ($)', type: 'number', step: '0.01', min: 0, inputmode: 'decimal', value: S.income || '', placeholder: '3500', hint: 'After taxes. Used to size budgets and savings rate.' },
      { name: 'skin', label: 'Skin tone', type: 'seg', value: String(S.skin), options: SKINS.map((c, i) => ({ v: String(i), l: 'Skin tone ' + (i + 1), sw: c })) },
      { name: 'hair', label: 'Hair style', type: 'seg', value: String(S.hair), options: HAIR_STYLES.map((l, i) => ({ v: String(i), l })) },
      { name: 'hc', label: 'Hair color', type: 'seg', value: String(S.hc), options: HAIRS.map((c, i) => ({ v: String(i), l: 'Hair color ' + (i + 1), sw: c })) }
    ],
    footer: `<div class="row" style="justify-content:center;margin-top:12px"><button class="link" data-a="export">Export data</button><button class="link" data-a="import">Import data</button><button class="link dng" data-a="reset">Erase everything</button></div><p class="fine" style="text-align:center;margin:8px 0 0">Data lives only in this browser. Export a backup now and then.</p>`,
    validate: v => { if (!v.name.trim()) return 'Your bro needs a name.'; if (v.income !== '' && !(parseAmt(v.income) >= 0)) return 'Enter a valid income.'; },
    onSubmit: v => {
      S.name = v.name.trim(); S.income = v.income === '' ? 0 : parseAmt(v.income);
      S.skin = +v.skin; S.hair = +v.hair; S.hc = +v.hc; save(); render();
      toast('Settings saved.');
    }
  });
}
function updateSetPrev() {
  const f = $('#mform'); if (!f) return;
  const g = n => +f.elements[n].value;
  $('#setPrev').innerHTML = broSVG({ skin: g('skin'), hair: g('hair'), hc: g('hc'), vb: '20 10 160 160', mood: 'happy' });
}
function openExport() {
  openModal(`<h2>Export data</h2><p class="muted">Copy this text and keep it somewhere safe. You can paste it back with Import.</p><textarea id="expTa" readonly>${esc(JSON.stringify(S))}</textarea><div class="row end"><button class="btn ghost" data-a="closeModal">Close</button><button class="btn primary" data-a="copyExport">Copy</button></div>`);
}
function copyExport() {
  const ta = $('#expTa'); ta.select();
  const done = () => toast('Copied to clipboard.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it manually.'); } });
  else { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it manually.'); } }
}
function openImport() {
  openModal(`<h2>Import data</h2><p class="muted">Paste an export from this app. This replaces everything currently saved.</p><textarea id="impTa" placeholder="Paste export here"></textarea><p class="err" id="impErr" role="alert"></p><div class="row end"><button class="btn ghost" data-a="closeModal">Cancel</button><button class="btn primary" data-a="doImport">Import</button></div>`);
}
function doImport() {
  try {
    const o = JSON.parse($('#impTa').value);
    if (!o || typeof o !== 'object' || o.v !== 1 || !Array.isArray(o.budgets)) throw new Error('bad');
    const d = defaults(); S = Object.assign(d, o, { eq: Object.assign(d.eq, o.eq || {}) });
    save(); closeModal(true); PV = null; VM = curMonth(); tickNeeds(); BUBBLE = 'Welcome back, boss. Data restored.'; render(); toast('Data imported.');
  } catch (e) { $('#impErr').textContent = 'That doesn’t look like a valid export.'; }
}
function doReset() {
  S = defaults(); save(); PV = null; TAB = 'home'; VM = curMonth(); render(); showOnboarding();
}

/* =====================================================================
   ONBOARDING
   ===================================================================== */
let OB = { skin: 1, hair: 0, hc: 0 };
function showOnboarding() {
  OB = { skin: 1, hair: 0, hc: 0 };
  const old = $('#onboard'); if (old) old.remove();
  const w = document.createElement('div'); w.id = 'onboard'; w.className = 'onboard';
  w.innerHTML = `<div class="ob-card" role="dialog" aria-modal="true" aria-label="Create your finance bro">
<h1 class="ob-title">My Little<br>Finance Bro</h1>
<p class="ob-sub">Budget for real. Earn coins for saving and investing. Dress your bro like a man with a plan.</p>
<div class="ob-preview" id="obPreview"></div>
<div class="ob-chips" id="obChips"></div>
<form id="obForm" novalidate>
<div class="field"><label for="obName">Name your bro</label><input id="obName" maxlength="14" placeholder="Chad" autocomplete="off"></div>
<div class="field"><label for="obInc">Monthly take-home pay (optional)</label><input id="obInc" type="number" inputmode="decimal" min="0" step="0.01" placeholder="3500" autocomplete="off"><small>After taxes. You can change it any time.</small></div>
<label class="check"><input type="checkbox" id="obStarter" checked> Build me a starter 50/30/20 budget</label>
<p class="err" id="obErr" role="alert"></p>
<button class="btn primary big" type="submit">Meet your bro</button>
</form>
<p class="fine" style="text-align:center;margin-top:14px">Everything stays in this browser. Bro tips are general education, not personalized financial advice.</p></div>`;
  document.body.appendChild(w); document.body.classList.add('noscroll');
  drawOb();
  $('#obForm').addEventListener('submit', e => {
    e.preventDefault();
    const inc = $('#obInc').value.trim();
    if (inc !== '' && !(parseAmt(inc) >= 0)) { $('#obErr').textContent = 'Enter a valid income or leave it blank.'; return; }
    S.name = $('#obName').value.trim() || 'Chad'; S.income = inc === '' ? 0 : parseAmt(inc);
    S.skin = OB.skin; S.hair = OB.hair; S.hc = OB.hc; S.onboarded = true; S.lastTick = Date.now();
    if ($('#obStarter').checked && S.income > 0) AUTO.forEach(([emoji, name, share]) => S.budgets.push({ id: uid(), name, emoji, limit: Math.max(5, Math.round(S.income * share / 5) * 5) }));
    save(); w.remove(); document.body.classList.remove('noscroll');
    BUBBLE = 'Yo! I’m ' + S.name + '. Log your money, earn coins, and get me a vest.';
    render(); toast('Welcome! You start with 50 coins.', { coin: true });
  });
  setTimeout(() => $('#obName').focus({ preventScroll: true }), 50);
}
function drawOb() {
  $('#obPreview').innerHTML = broSVG({ eq: { hat: null, eyes: null, top: 'tee', neck: null, bg: 'office' }, mood: 'happy', skin: OB.skin, hair: OB.hair, hc: OB.hc });
  const sw = (k, arr, lbl) => arr.map((c, i) => `<button type="button" class="swatch ${OB[k] === i ? 'on' : ''}" style="--sw:${c}" data-a="obSet" data-k="${k}" data-v="${i}" aria-label="${lbl} ${i + 1}" aria-pressed="${OB[k] === i}"></button>`).join('');
  $('#obChips').innerHTML = `<div class="lbl">Skin tone</div><div class="seg">${sw('skin', SKINS, 'Skin tone')}</div><div class="lbl">Hair style</div><div class="seg">${HAIR_STYLES.map((l, i) => `<button type="button" class="${OB.hair === i ? 'on' : ''}" data-a="obSet" data-k="hair" data-v="${i}" aria-pressed="${OB.hair === i}">${l}</button>`).join('')}</div><div class="lbl">Hair color</div><div class="seg">${sw('hc', HAIRS, 'Hair color')}</div>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.a) {
    case 'tab': setTab(d.tab, d.gt, d.slot); break;
    case 'gt': GT = d.gt; render(); break;
    case 'slot': SL = d.slot; render(); break;
    case 'vm': VM = shiftMonth(VM, +d.d); if (VM > curMonth()) VM = curMonth(); render(); break;
    case 'pet': pet(e); break;
    case 'feed': openFeed(); break;
    case 'eat': eat(d.id); break;
    case 'chat': chat(); break;
    case 'settings': openSettings(); break;
    case 'closeModal': closeModal(); break;
    case 'pick': pickBtn(el); break;
    case 'confirmYes': { const f = CONFIRM; CONFIRM = null; closeModal(true); if (f) f(); break; }
    case 'newBudget': openBudgetForm(); break;
    case 'editBudget': openBudgetForm(d.id); break;
    case 'delBudget': delBudget(d.id); break;
    case 'autoBudget': autoBudget(); break;
    case 'newTxn': openTxnForm(d.b); break;
    case 'delTxn': delTxn(d.id); break;
    case 'newGoal': openGoalForm(null, d.preset); break;
    case 'editGoal': openGoalForm(d.id); break;
    case 'delGoal': delGoal(d.id); break;
    case 'newDeposit': openDepositForm(d.id); break;
    case 'delDeposit': { const x = S.deposits.find(v => v.id === d.id); if (x) { reverseReward(x.reward); S.deposits = S.deposits.filter(v => v.id !== d.id); save(); render(); toast('Deposit removed' + (x.reward ? ' and its coins returned.' : '.')); } break; }
    case 'newInvest': openInvestForm(); break;
    case 'delInvest': { const x = S.investments.find(v => v.id === d.id); if (x) { reverseReward(x.reward); S.investments = S.investments.filter(v => v.id !== d.id); save(); render(); toast('Entry removed' + (x.reward ? ' and its coins returned.' : '.')); } break; }
    case 'trade': openTrade(d.t, d.side); break;
    case 'sellAll': sellAll(d.t); break;
    case 'mday': stepMarket(+d.n); S.market.last = Date.now(); save(); render(); break;
    case 'mreset': confirmBox('Reset practice portfolio?', 'You’ll start over with $10,000 of practice cash and new prices.', 'Reset', () => { S.market = null; save(); render(); }); break;
    case 'try': PV = (PV && PV.id === d.id) ? null : { slot: d.slot, id: d.id }; render(); break;
    case 'clearPV': PV = null; render(); break;
    case 'buy': buy(d.id); break;
    case 'equip': equip(d.id); break;
    case 'unequip': S.eq[d.slot] = null; save(); render(); break;
    case 'claim': claim(d.id); break;
    case 'export': openExport(); break;
    case 'copyExport': copyExport(); break;
    case 'import': openImport(); break;
    case 'doImport': doImport(); break;
    case 'reset': confirmBox('Erase everything?', 'This deletes your bro, budgets, goals, coins and outfits from this browser. Export first if you want a backup.', 'Erase everything', doReset); break;
    case 'obSet': OB[d.k] = +d.v; drawOb(); break;
  }
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('[data-calc]')) updateCalc(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal')) closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickNeeds(); save(); render(); } });

/* =====================================================================
   INIT
   ===================================================================== */
tickNeeds();
if (S.market) catchUpMarket();
{ const a = advice(); BUBBLE = S.onboarded ? (a.length ? a[0].say : 'Tap me. I dare you.') : 'Yo! Make me look good.'; }
render();
if (!S.onboarded) showOnboarding();
setInterval(() => { tickNeeds(); save(); updateMeters(); refreshBro(); }, 60000);
</script>
</body>
</html>
